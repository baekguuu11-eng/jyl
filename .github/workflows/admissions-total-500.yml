name: Isolated admissions total 500
on:
  push:
    branches: [agent/admissions-total-500]
    paths:
      - .github/workflows/admissions-total-500.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/admissions-total-500.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone collector source
        run: git clone --depth 1 --branch agent/admissions-archive-300 https://github.com/baekguuu11-eng/chatgpt.git collector
      - name: Install dependencies
        working-directory: collector
        run: pip install requests beautifulsoup4 pypdf
      - name: Download official ADIGA 2028 archives
        working-directory: collector
        run: python admissions_archive/download_official_archives.py
      - name: Download official ADIGA result compilations
        working-directory: collector
        run: python admissions_archive/download_adiga_results.py
      - name: Collect exactly 500 unique target slots
        working-directory: collector
        run: python admissions_archive/fast_collect_total_500.py
      - name: Validate 500 unique university-year slots
        working-directory: collector
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          r=Path('total500_output/total_500_slots')
          rows=list(csv.DictReader((r/'slot_manifest.csv').open(encoding='utf-8-sig')))
          s=json.loads((r/'summary.json').read_text(encoding='utf-8'))
          assert len(rows)==500,len(rows)
          assert len({(x['university'],x['year']) for x in rows})==500
          assert s['selected_slots']==500
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - name: Package result
        working-directory: collector
        run: cd total500_output && zip -r -9 ../admissions-total-500-slots.zip total_500_slots
      - uses: actions/upload-artifact@v4
        with:
          name: admissions-total-500-slots
          path: collector/admissions-total-500-slots.zip
          if-no-files-found: error
          retention-days: 7
